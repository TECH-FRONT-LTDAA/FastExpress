<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastExpress · Cotizador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>FastExpress</h1>
      <p>Cotizador de envíos y descuentos</p>
    </header>

    <form id="form-cotizacion" method="post" action="#" novalidate>
      <label for="peso">Peso del paquete (kg)</label>
      <input id="peso" name="peso" type="number" step="0.01" min="0.01" max="20" placeholder="Ej. 3.50" required>
      <small class="error" id="error-peso"></small>

      <label for="tipo_cliente">Tipo de cliente</label>
      <select id="tipo_cliente" name="tipo_cliente" required>
        <option value="">Seleccione…</option>
        <option value="NUEVO">Nuevo (0 %)</option>
        <option value="FRECUENTE">Frecuente (10 %)</option>
        <option value="VIP">VIP (20 %)</option>
      </select>
      <small class="error" id="error-tipo_cliente"></small>

      <label for="tipo_envio">Tipo de envío</label>
      <select id="tipo_envio" name="tipo_envio" required>
        <option value="">Seleccione…</option>
        <option value="ESTANDAR">Estándar (sin recargo)</option>
        <option value="EXPRESS">Express (+25 %)</option>
      </select>
      <small class="error" id="error-tipo_envio"></small>

      <button type="submit" id="btn-cotizar">Cotizar</button>
    </form>

    <section id="mensaje" class="mensaje" hidden></section>

    <section id="resultado" hidden>
      <h2>Desglose</h2>
      <table>
        <tbody>
          <tr><th>Tarifa base</th><td id="r-tarifa_base"></td></tr>
          <tr><th>Costo por peso</th><td id="r-costo_peso"></td></tr>
          <tr><th>Subtotal</th><td id="r-subtotal"></td></tr>
          <tr><th>Recargo por envío</th><td id="r-recargo"></td></tr>
          <tr><th>Descuento por cliente</th><td id="r-descuento"></td></tr>
          <tr class="total"><th>Total a pagar</th><td id="r-total"></td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
